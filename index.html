   .bindPopup(function(){return popupHtml(i);},{maxWidth:330}).bindTooltip(p.nama).addTo(mk);
});

KEC.forEach(function(k){
  L.circleMarker([k.lat,k.lon],{radius:0,opacity:0,fillOpacity:0,interactive:false})
   .bindTooltip(k.n,{permanent:true,direction:'center',className:'kec-label'}).addTo(map);
});
var lg=L.control({position:'topright'});
lg.onAdd=function(){
  var d=L.DomUtil.create('div','panel');
  var h='<button id="tg" title="Tampil/sembunyi">&raquo;</button><h5>Total kunjungan</h5><div id="lgbody">';
  for(var i=0;i<palette.length;i++){
    h+='<span class="sw" style="background:'+palette[i]+'"></span>'+fmt(Math.round(MIN+step*i))+' &ndash; '+fmt(Math.round(MIN+step*(i+1)))+'<br>';
  }
  h+='<span class="sw" style="background:#639B78;border-radius:6px;border-color:#fff"></span>Puskesmas<br>';
  h+='<div style="margin-top:6px">Kunjungan &ge; <b id="fv">'+fmt(MIN)+'</b><br><input id="flt" type="range" min="'+MIN+'" max="'+MAX+'" value="'+MIN+'" step="100"><a class="clr" id="clr">hapus filter</a></div></div>';
  d.innerHTML=h;
  L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
  d.querySelector('#tg').onclick=function(){var b=d.querySelector('#lgbody');b.classList.toggle('hide');this.innerHTML=b.classList.contains('hide')?'&laquo;':'&raquo;';};
  var s=d.querySelector('#flt');
  s.oninput=function(){thr=+this.value;d.querySelector('#fv').textContent=fmt(thr);poly.setStyle(style);};
  d.querySelector('#clr').onclick=function(){s.value=MIN;thr=MIN;d.querySelector('#fv').textContent=fmt(MIN);poly.setStyle(style);};
  if(window.innerWidth<600){d.querySelector('#lgbody').classList.add('hide');d.querySelector('#tg').innerHTML='&laquo;';}
  return d;
};
lg.addTo(map);
L.control.scale({imperial:false}).addTo(map);
</script>
</body>
</html>
